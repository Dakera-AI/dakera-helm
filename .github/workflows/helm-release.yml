name: Release Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and Release Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dakera-helm
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Lint chart
        run: |
          helm lint charts/dakera/ \
            --set dakera.rootApiKey=ci-lint \
            --set minio.rootPassword=ci-lint

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts
          config: cr.yaml
        env:
          CR_TOKEN: ${{ secrets.GH_PAT_PACKAGES }}

      - name: Preserve artifacthub-repo.yml on gh-pages
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          if [ ! -f artifacthub-repo.yml ]; then
            git checkout origin/main -- charts/dakera/artifacthub-repo.yml
            cp charts/dakera/artifacthub-repo.yml ./artifacthub-repo.yml
            git rm --cached charts/dakera/artifacthub-repo.yml 2>/dev/null || true
            git add artifacthub-repo.yml
            git commit -m "preserve artifacthub-repo.yml"
            git push origin gh-pages
          fi
