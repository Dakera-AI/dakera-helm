name: Release Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write  # required for Cosign keyless signing via GitHub OIDC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and Release Helm Chart
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dakera-helm
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Lint chart
        run: |
          helm lint charts/dakera/ \
            --set dakera.rootApiKey=ci-lint \
            --set minio.rootPassword=ci-lint

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.6.0
        with:
          charts_dir: charts
          config: cr.yaml
        env:
          CR_TOKEN: ${{ secrets.GH_PAT_PACKAGES }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign chart package with Cosign (keyless via GitHub OIDC)
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          CHART_VERSION=$(grep '^version:' charts/dakera/Chart.yaml | awk '{print $2}')
          CHART_PKG=".cr-release-packages/dakera-${CHART_VERSION}.tgz"
          if [ -f "${CHART_PKG}" ]; then
            cosign sign-blob \
              --yes \
              --output-signature "${CHART_PKG}.sig" \
              "${CHART_PKG}"
            echo "Chart signed: ${CHART_PKG}.sig"
          else
            echo "Chart package not found at ${CHART_PKG} — skipping signing"
          fi

      - name: Preserve artifacthub-repo.yml on gh-pages
        run: |
          git fetch origin gh-pages
          git checkout gh-pages
          if [ ! -f artifacthub-repo.yml ]; then
            git checkout origin/main -- charts/dakera/artifacthub-repo.yml
            cp charts/dakera/artifacthub-repo.yml ./artifacthub-repo.yml
            git rm --cached charts/dakera/artifacthub-repo.yml 2>/dev/null || true
            git add artifacthub-repo.yml
            git commit -m "preserve artifacthub-repo.yml"
            git push origin gh-pages
          fi
