name: Publish Helm Chart OCI

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Push chart to GHCR OCI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4.3.1
        with:
          version: v3.14.4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      # Every change under charts/ reaches this job, but a published version is never
      # overwritten: OCI tags are mutable, and users who pinned --version X must keep
      # getting what X was. A change is published with the next version bump
      # (charts/dakera/Chart.yaml); chart-releaser skips existing versions the same way
      # (cr.yaml skip-existing).
      - name: Package + push chart (new versions only)
        run: |
          VERSION=$(helm show chart charts/dakera | awk '/^version:/ {print $2}')
          if helm show chart oci://ghcr.io/dakera-ai/dakera-helm/dakera --version "$VERSION" >/dev/null 2>&1; then
            echo "::notice::dakera $VERSION is already published to oci://ghcr.io/dakera-ai/dakera-helm; not overwriting it (bump the chart version to publish)"
            exit 0
          fi
          helm package charts/dakera
          helm push dakera-*.tgz oci://ghcr.io/dakera-ai/dakera-helm
