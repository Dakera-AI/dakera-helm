# =============================================================================
# Dakera Helm Chart - Default Values
# =============================================================================
# Override any value with:
#   helm install dakera ./charts/dakera -f my-values.yaml
#   helm install dakera ./charts/dakera --set dakera.replicaCount=3

# ---- Dakera Server ----------------------------------------------------------
# Chart 0.12.0 deploys Dakera server v0.12.0. For v0.11 use the release/0.11
# branch or a 0.11.x chart version (see README, "Versions").
dakera:
  image:
    repository: ghcr.io/dakera-ai/dakera
    tag: ""  # defaults to the chart appVersion
    pullPolicy: IfNotPresent

  replicaCount: 1

  config:
    host: "0.0.0.0"
    port: 3000
    grpcPort: 50051
    storage: s3  # memory | filesystem | s3
    s3Bucket: dakera
    s3Region: us-east-1
    # External S3 (only used when minio.enabled=false); with the built-in MinIO
    # the endpoint is the chart's own MinIO service.
    # s3Endpoint: https://s3.amazonaws.com
    # The data root (DAKERA_STORAGE_PATH). Every local path derives from it —
    # write-ahead log, RocksDB hot tier, warm tier, knowledge graph, filesystem
    # backend — and the persistence volume below is mounted exactly here, so all
    # of it lands on the PVC. Keep it equal to the image's root (/data) unless
    # you also change where the volume should go.
    dataRoot: /data
    # Tiered-storage settings: no effect unless tieredStorage is true (tiered storage
    # needs storage: s3). l1CacheSize is the hot-tier budget: with a unit suffix ("1GB",
    # "512MB") it is bytes; a bare number below 10 million is a vector COUNT (the server's
    # default is 100000 vectors) and a bare number of 10 million or more is bytes, with a
    # startup warning. Use the suffix.
    l1CacheSize: "1GB"
    tieredStorage: true
    hotToWarmSecs: 3600
    warmToColdSecs: 86400
    autoTier: true
    tierCheckIntervalSecs: 300
    # DAKERA_TIERED: the tiered EMBEDDING engine (always embeds with the default
    # model and ignores DAKERA_MODEL). Not the same as tieredStorage. Must be the
    # same on every node that shares a store.
    tiered: "1"
    searchMode: hybrid
    maxBodySize: "524288000"  # 500 MB
    authEnabled: true
    rustLog: info

  # Root API key — REQUIRED. Set via --set or external secret.
  # rootApiKey: ""

  # Cluster mode (DAKERA_CLUSTER_MODE=true, set through extraEnv) needs
  # DAKERA_CLUSTER_SECRET: at least 16 characters, the same on every node. It is
  # kept in a Secret, never in the ConfigMap. Give it either way:
  #   secret:        the chart stores it in <release>-secrets (key DAKERA_CLUSTER_SECRET)
  #   existingSecret: read it from a Secret you manage (name + key)
  # Leave both empty for a standalone server. During a rolling v0.11 -> v0.12
  # cluster upgrade leave it unset until every node runs v0.12 (UPGRADE.md,
  # "Cluster"). Also set a stable DAKERA_CLUSTER_NODE_ID per node.
  cluster:
    secret: ""
    existingSecret:
      name: ""
      key: DAKERA_CLUSTER_SECRET

  # Extra environment variables for the Dakera container, appended AFTER the ones
  # the chart sets from `config` above. Standard Kubernetes EnvVar list: each item
  # is {name, value} or {name, valueFrom}. Do not repeat a name the chart already
  # sets (DAKERA_HOST/PORT/GRPC_PORT/STORAGE/STORAGE_PATH/S3_*/AUTH_ENABLED/
  # TIERED*/SEARCH_MODE/..., RUST_LOG). DAKERA_DATA_DIR is an alias of
  # DAKERA_STORAGE_PATH: do not set it. Values must be strings.
  #
  #   extraEnv:
  #     - name: DAKERA_MODEL              # embedding model (see the model guard note below)
  #       value: bge-m3
  #     - name: DAKERA_ENCRYPTION_KEY
  #       valueFrom:
  #         secretKeyRef: {name: my-dakera-secrets, key: encryptionKey}
  #     - name: DAKERA_CLUSTER_MODE
  #       value: "true"
  #
  # Embedding-model guard: the store records the model that embedded it, and a pod
  # whose effective model differs exits at startup. To switch models on an
  # existing store, set DAKERA_ALLOW_MODEL_CHANGE=1 for ONE rollout, re-embed with
  # POST /admin/namespaces/migrate-dimensions, then remove it again.
  extraEnv: []

  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""

  # Models. The image ships bge-large and the reranker in its own model store
  # (/usr/local/share/dakera/models): they load in seconds with no network and
  # need nothing below. Any other model (DAKERA_MODEL=bge-m3 / colbert-small,
  # whisper, the vision model, GLiNER) is downloaded into the model cache
  # (/app/models) on first use.
  models:
    # Pulled by an init container (`dakera models pull`) before the server
    # starts. Model names (`dakera models list`), or `configured`: what the
    # environment above configures (extraEnv included).
    #   pull: [configured]
    #   pull: [bge-m3, whisper]       # `whisper` is the default model; name another, e.g. whisper-base
    pull: []
    # Keep the model cache on a volume so a restarted or rescheduled pod does
    # not download again. Off: the cache is an emptyDir. Air-gapped: seed this
    # volume ahead (`dakera models pull`) from a host that can reach the Hub.
    # ReadWriteMany shares one cache between replicas; ReadWriteOnce needs one.
    persistence:
      enabled: false
      size: 10Gi
      storageClass: ""
      accessMode: ReadWriteOnce

  # ---- v0.12 features (ALL OFF BY DEFAULT) ----------------------------------------------
  # Each block switches one v0.12 feature on, with the variables it needs, and wires what
  # it implies (the model cache volume, an init container that pulls the models, resources).
  # With everything off the chart renders exactly what it did without this block. Per
  # feature: what it is, the resources it costs, what it cannot be combined with and how to
  # verify it: README, "Features in v0.12.0", and the dakera-deploy guide docs/features-v0.12.md.
  #
  # Checks (helm refuses to render, with a message, instead of a pod that exits at start):
  #   * multilingual, lateInteraction and vision need dakera.config.tiered: "0" (the tiered
  #     embedding engine always embeds with bge-large and refuses late interaction);
  #   * multilingual and lateInteraction are exclusive (one embedding model per store);
  #   * vision is a store of its own: not with multilingual / lateInteraction, and install it
  #     as its own release (its namespaces hold 128-d page vectors, not text embeddings);
  #   * rabitq needs dakera.config.searchMode left at "hybrid".
  # multilingual, lateInteraction and vision change the embedding model or the lane: a FRESH
  # store only. To move an existing store, acknowledge the change for ONE rollout with
  # extraEnv DAKERA_ALLOW_MODEL_CHANGE=1 and re-embed (see the extraEnv note above). They
  # are one-way for v0.11 (`dakera downgrade` refuses them).
  features:
    # When a feature that needs a model outside the image is on (multilingual,
    # lateInteraction, multimodal, vision):
    #   prePull: an init container runs `dakera models pull configured` (when
    #     dakera.models.pull is empty), so the pod is ready with the models on disk and a
    #     model whose one-time conversion would not fit the memory budget is converted
    #     outside the server;
    #   persistModelCache: the model cache is a PVC (dakera.models.persistence.size, 10Gi by
    #     default: bge-m3 ~570 MB, colbert-small ~34 MB, whisper-tiny.en ~151 MB (the default whisper-base: TODO, being measured),
    #     colmodernvbert ~966 MB, GLiNER ~782 MB, each plus an ORT-format copy of about the
    #     same size) so a restarted pod does not download again. ReadWriteOnce: one server pod.
    prePull: true
    persistModelCache: true

    # Multilingual: bge-m3 (1024-d, CPU ONNX only, ~570 MB download) + per-language
    # full-text + CJK bigrams + multilingual query routing. Per request: "lang".
    multilingual:
      enabled: false
      # BM25 analyzer of NEWLY created namespace indexes (DAKERA_FULLTEXT_LANGUAGE): an ISO
      # 639-1 code or English name (de, french, pt-BR, ...), or zh/ja/ko/th/none/multilingual
      # (no stemming). Existing namespaces: POST /admin/fulltext/reindex {"rebuild": true}.
      fulltextLanguage: multilingual
      # DAKERA_FULLTEXT_CJK_BIGRAMS: "" follows the language (on unless en); "true" / "false".
      cjkBigrams: ""
      # DAKERA_QUERY_LANG: en de fr es it pt nl, or auto (detected per query).
      queryLang: auto
      # DAKERA_MAX_SEQ_LENGTH: "" = the model's default cap (2048 for bge-m3; it supports
      # 8192 at about 4 GiB of attention scores per layer per row).
      maxSeqLength: ""

    # Multimodal: attachments (files per agent, referenced from memories) + speech to text
    # (WAV only). Works on an existing store. The Whisper model is DAKERA_WHISPER_MODEL, set
    # through dakera.extraEnv (default whisper-base):
    #   whisper-base     multilingual (~99 languages), language auto-detected; the default, recommended
    #   whisper-tiny.en  English, the lightest (~151 MB)
    #   whisper-base.en  English, better
    #   whisper-tiny     multilingual, the lightest
    #   whisper-small    multilingual, the quality option
    # Upgrading: with no DAKERA_WHISPER_MODEL set, speech now transcribes with whisper-base;
    # set whisper-tiny.en to keep the lightest English model.
    # Multilingual models record the detected language as the memory's lang (a per-request
    # lang overrides it). Models are SHA-pinned; `dakera models pull` (dakera.models.pull)
    # covers every variant. TODO: sizes of the new models once measured.
    multimodal:
      enabled: false
      # DAKERA_ATTACHMENT_MAX_BYTES: "" = 26214400 (25 MiB). Also bounded by DAKERA_MAX_BODY_SIZE
      # (dakera.config.maxBodySize).
      attachmentMaxBytes: ""
      # DAKERA_MEM_HIGH_WATER_FRACTION: "" = 0.85. A media job reserves its peak memory against
      # the limit x this, waits up to 10 s, then answers 503 + Retry-After.
      memHighWaterFraction: ""
      # Used INSTEAD of dakera.resources while this feature is on: the measured configuration
      # is a 4-core / 8 GiB container with every model loaded (530 MiB anonymous memory; an image
      # page peaks +1.9 GiB at 17 tiles). null (--set dakera.features.multimodal.resources=null) keeps dakera.resources.
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "4"
          memory: 8Gi

    # Vision: image / page indexing and visual recall (colmodernvbert, ~966 MB, ~10.7 s per
    # page on CPU, one page at a time; PNG only). Implies attachments. A DEDICATED store: install
    # it as its own release (own MinIO / bucket and data volume), never over a text store.
    vision:
      enabled: false
      # Used INSTEAD of dakera.resources (and of multimodal.resources) while vision is on; null keeps dakera.resources.
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "4"
          memory: 8Gi

    # Multi-vector records: POST /v1/namespaces/{ns}/records, one indexed vector plus up to 8
    # named extra representations. Works on an existing store.
    records:
      enabled: false
      maxVectors: ""   # DAKERA_RECORD_MAX_VECTORS, "" = 4096
      maxBytes: ""     # DAKERA_RECORD_MAX_BYTES, "" = 8388608 (8 MiB)

    # Late interaction: DAKERA_MODEL=colbert-small (~34 MB, 96-d token vectors) +
    # DAKERA_SCORING_STRATEGY=late-interaction: recall reranks with MaxSim per token. Opt-in
    # for a reason: on the same LoCoMo harness it scored below bge-large (better only on
    # multi-hop questions; server RELEASE_NOTES).
    lateInteraction:
      enabled: false

    # RaBitQ search mode (DAKERA_SEARCH_MODE=rabitq): a LATENCY option. Its codes sit in memory
    # next to the float vectors (no memory saving) and are rebuilt after a restart.
    rabitq:
      enabled: false
      bits: ""         # DAKERA_RABITQ_BITS: 1-8, "" = 1 (4 is the usual quality point)

  # The image runs as uid/gid 1000 (`dakera`). fsGroup gives that group the
  # volumes the chart mounts (data PVC, model cache, emptyDirs) so a provisioner
  # whose volume root is root:root 0755 does not leave the server unable to write
  # (Init:CrashLoopBackOff on EACCES). OnRootMismatch avoids a recursive walk of
  # a large volume at every start.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

  # Root filesystem read-only. Everything the server writes is on a volume (the
  # data root, the model cache, /tmp); turn persistence off only together with
  # this off.
  readOnlyRootFilesystem: false

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

  # A server locks its data root while it runs (one server per data root), so
  # the chart does not scale one release horizontally: autoscaling is off by
  # default. Enable it only with persistence.enabled=false and an external S3.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  service:
    type: ClusterIP
    httpPort: 3000
    grpcPort: 50051

# ---- Rollback to v0.11 -------------------------------------------------------
# `dakera downgrade` makes the data v0.11.108's again. It is a one-off Job that
# must run AFTER the server has stopped. It is not rendered unless enabled; see
# README, "Rolling back to v0.11":
#   kubectl scale deploy/<fullname> --replicas=0
#   helm template <release> ./charts/dakera <your values> \
#     --set rollback.enabled=true --show-only templates/rollback-job.yaml \
#     | kubectl apply -f -
rollback:
  enabled: false
  # Image that runs `downgrade`: the v0.12 image (default: the server's).
  image: ""
  ttlSecondsAfterFinished: 86400

# ---- Dakera Dashboard -------------------------------------------------------
dashboard:
  enabled: true
  image:
    repository: ghcr.io/dakera-ai/dakera-dashboard
    tag: "0.3.29"
    pullPolicy: IfNotPresent

  replicaCount: 1

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  service:
    type: ClusterIP
    port: 3000

# ---- Dakera MCP Server ------------------------------------------------------
# Off by default: dakera-mcp (0.10.x) speaks MCP over stdio only. As a pod nothing
# writes to its stdin, so it exits at once and restarts in a loop (CrashLoopBackOff,
# measured with 0.10.11); it never listens on mcp.config.port. Run it next to the MCP
# client instead (`dakera-mcp` with DAKERA_API_URL and DAKERA_API_KEY).
mcp:
  enabled: false
  image:
    repository: ghcr.io/dakera-ai/dakera-mcp
    tag: "0.10.11"
    pullPolicy: IfNotPresent

  replicaCount: 1

  config:
    port: 3001

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  service:
    type: ClusterIP
    port: 3001

# ---- MinIO (built-in S3) ----------------------------------------------------
minio:
  enabled: true
  # minio/minio is no longer published on Docker Hub (the repository is gone, so its
  # tags cannot be pulled). Chainguard's maintained MinIO build; its free tier
  # publishes `latest` only.
  image:
    repository: cgr.dev/chainguard/minio
    tag: latest
    pullPolicy: IfNotPresent

  # Credentials — override via --set or external secret
  rootUser: dakera-minio  # override with a non-default username to reduce attack surface
  rootPassword: ""  # REQUIRED — set before deploying

  persistence:
    size: 50Gi
    storageClass: ""

  # MinIO needs >=4GB RAM under bench-load concurrency (DAK-3971)
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

# Use external S3 instead of MinIO:
# minio:
#   enabled: false
# dakera:
#   config:
#     s3Endpoint: https://s3.amazonaws.com

# ---- Ingress ----------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  # apiHost: api.dakera.yourdomain.com
  # dashboardHost: dashboard.dakera.yourdomain.com
  # mcpHost: mcp.dakera.yourdomain.com
  annotations: {}
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
  tls: []
    # - secretName: dakera-tls
    #   hosts:
    #     - api.dakera.yourdomain.com

# ---- Monitoring (Prometheus + Grafana) -------------------------------------
monitoring:
  # NOTE: `enabled` still has no templates (it never had): the Prometheus / Grafana blocks
  # below are inert. Use your own Prometheus (the server pod is annotated
  # prometheus.io/scrape, port, path /metrics) and the two opt-in objects that follow.
  enabled: false

  # The server's v0.12 alert rules as a Prometheus Operator PrometheusRule (the CRD must
  # exist): config warnings, degraded components, WAL, model loads, backups, encryption,
  # cold tier, RocksDB, cluster replication. Off by default. `labels` is what your
  # Prometheus' ruleSelector matches (kube-prometheus-stack: `release: <its release>`).
  # DakeraDown matches job="dakera": name your scrape job so, or edit the rule.
  prometheusRule:
    enabled: false
    labels: {}

  # The server's v0.12 "Dakera Overview" dashboard as a ConfigMap for Grafana's dashboard
  # sidecar (kube-prometheus-stack loads label grafana_dashboard: "1"). Off by default.
  grafanaDashboard:
    enabled: false
    label: grafana_dashboard
    labelValue: "1"

  prometheus:
    image:
      repository: prom/prometheus
      tag: v3.2.0
    retention: 15d
    persistence:
      size: 10Gi
      storageClass: ""

  grafana:
    image:
      repository: grafana/grafana
      tag: "11.4.0"
    adminUser: admin
    adminPassword: ""  # auto-generated if empty
    persistence:
      size: 5Gi
      storageClass: ""

# ---- Global -----------------------------------------------------------------
global:
  namespace: dakera
  imagePullSecrets: []
