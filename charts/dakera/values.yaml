# =============================================================================
# Dakera Helm Chart - Default Values
# =============================================================================
# Override any value with:
#   helm install dakera ./charts/dakera -f my-values.yaml
#   helm install dakera ./charts/dakera --set dakera.replicaCount=3

# ---- Dakera Server ----------------------------------------------------------
# Chart 0.12.3 deploys Dakera server v0.12.3. For v0.11 use the release/0.11
# branch or a 0.11.x chart version (see README, "Versions").
dakera:
  image:
    repository: ghcr.io/dakera-ai/dakera
    # Defaults to the chart appVersion. The image is distroless from 0.12.3: uid/gid 1000,
    # /bin/sh only (no curl, wget or coreutils); probes are httpGet. The GPU image
    # (tag `gpu` / `cuda`, or <version>-gpu) is built on CUDA 13 from 0.12.3: the nodes need
    # NVIDIA driver R580 or newer (and the NVIDIA device plugin; request nvidia.com/gpu in
    # dakera.resources).
    tag: ""
    pullPolicy: IfNotPresent

  replicaCount: 1

  config:
    host: "0.0.0.0"
    port: 3000
    grpcPort: 50051
    storage: s3  # memory | filesystem | s3
    s3Bucket: dakera
    s3Region: us-east-1
    # External S3 (only used when minio.enabled=false); with the built-in MinIO
    # the endpoint is the chart's own MinIO service.
    # s3Endpoint: https://s3.amazonaws.com
    # The data root (DAKERA_STORAGE_PATH). Every local path derives from it —
    # write-ahead log, RocksDB hot tier, warm tier, knowledge graph, filesystem
    # backend — and the persistence volume below is mounted exactly here, so all
    # of it lands on the PVC. Keep it equal to the image's root (/data) unless
    # you also change where the volume should go.
    dataRoot: /data
    # Tiered-storage settings: no effect unless tieredStorage is true (tiered storage
    # needs storage: s3). l1CacheSize is the hot-tier budget: with a unit suffix ("1GB",
    # "512MB") it is bytes; a bare number below 10 million is a vector COUNT (the server's
    # default is 100000 vectors) and a bare number of 10 million or more is bytes, with a
    # startup warning. Use the suffix.
    l1CacheSize: "1GB"
    tieredStorage: true
    hotToWarmSecs: 3600
    warmToColdSecs: 86400
    autoTier: true
    tierCheckIntervalSecs: 300
    # DAKERA_TIERED: the tiered EMBEDDING engine (always embeds with the default
    # model and ignores DAKERA_MODEL). Not the same as tieredStorage. Must be the
    # same on every node that shares a store.
    tiered: "1"
    searchMode: hybrid
    maxBodySize: "524288000"  # 500 MB
    authEnabled: true
    rustLog: info

    # ---- Server 0.12.2 settings: optional, rendered only when set -----------------------
    # Empty ("") leaves the variable out and the server's default applies. Write them as
    # strings. Every value below is checked by values.schema.json: the server refuses to
    # boot on a value it cannot read.
    #
    # DAKERA_SESSION_IDLE_TIMEOUT_SECS: a session with no activity for this many seconds is
    # ended by the server, exactly as a client end (memory count, summary memory, session-end
    # consolidation; ended_reason "idle"). Server default 14400 (4 h). "0" = the server ends
    # no session that did not set its own idle_timeout_secs. At most 2592000 (30 days);
    # larger values are clamped. Activity: a memory written with the session, a
    # session-scoped recall / search, or POST /v1/sessions/{id}/touch. Also adjustable at
    # runtime (PUT /admin/config session_idle_timeout_secs).
    #   sessionIdleTimeoutSecs: "14400"
    sessionIdleTimeoutSecs: ""
    # DAKERA_MAX_MEMORY_CONTENT_BYTES: the longest memory content, in UTF-8 BYTES (not
    # characters), any memory write accepts (store, batch, update, import, transcripts,
    # consolidate / summarize output, a session-end summary). Server default 100000. An
    # integer > 0 ("0" refuses the boot). Bounded in practice by maxBodySize.
    #   maxMemoryContentBytes: "100000"
    maxMemoryContentBytes: ""
    # DAKERA_VECTOR_CACHE_BYTES: the in-process L1 VECTOR cache (point reads of recently
    # written or read records). Server default 128MB. A byte size ("256MB", "1GB",
    # "268435456": a bare number is bytes). NOT l1CacheSize above, which is the
    # tiered-storage hot-tier budget (DAKERA_L1_CACHE_SIZE). Counts against the memory limit.
    #   vectorCacheBytes: "256MB"
    vectorCacheBytes: ""
    # DAKERA_ROCKSDB_RECORD_FORMAT: how the RocksDB hot tier writes NEW records: binary (the
    # 0.12.2 default: raw float embeddings, about a third of the bytes, faster decode) or
    # json (the pre-0.12.2 writer). Both are always read, so it can change at any restart.
    # json is not needed to roll back: 0.12.0 / 0.12.1 read binary records, and the rollback
    # Job (dakera downgrade, the server's image) rewrites them as JSON for v0.11.108.
    #   rocksdbRecordFormat: binary
    rocksdbRecordFormat: ""

    # ---- Server 0.12.3 settings: optional, rendered only when set -------------------------
    # An image up to 0.12.2 does not know these names (it lists them as unknown
    # configuration): set them only with 0.12.3 or later. Strings; checked by values.schema.json.
    #
    # DAKERA_HTTP_HEADER_READ_TIMEOUT_SECS: seconds a client has to send a complete HTTP/1
    # request head on the REST port, counted from when the server waits for one: a new
    # connection, or an IDLE KEEP-ALIVE one, which is closed after this long. Server default
    # 30, [1, 86400]; it also closes an HTTP/2 connection that sends no request. A proxy
    # that keeps idle connections to the pods longer than this
    # (ingress-nginx: upstream-keepalive-timeout, 60 s by default; cloud load balancers) can
    # send a request on a connection the server has just closed (502): keep the proxy's idle
    # timeout below this value, or raise this above it (README, "Ingress and load balancers").
    #   httpHeaderReadTimeoutSecs: "30"
    httpHeaderReadTimeoutSecs: ""
    # Recall (POST /v1/memory/recall). Empty = the server's default.
    # DAKERA_NEIGHBORHOOD_MODE: inline (default: neighbourhood context after the top_k
    # results, marked retrieval: "neighborhood") | separate (in context_memories, so memories
    # holds at most top_k) | off. A request's neighborhood_mode wins.
    neighborhoodMode: ""
    # DAKERA_NEIGHBORHOOD_EVENT_TIME: "true" = neighbourhood window on event time (default off).
    neighborhoodEventTime: ""
    # DAKERA_RECALL_RANK_DEPTH: ranking depth floor, 1-1000 (default 10): the first k results
    # of a top_k=k recall are the first k of a top_k=10 recall for k <= it.
    recallRankDepth: ""
    # DAKERA_RECALL_COLLAPSE_DERIVED: "true" = one result per source memory, derived sentence
    # sub-memories collapsed into it (matched_text, matched_ids). Default off.
    recallCollapseDerived: ""
    # DAKERA_RECALL_EXCLUDE_SUMMARIES: "true" = session summaries left out of recall unless a
    # request sets include_summaries (default off).
    recallExcludeSummaries: ""
    # DAKERA_RECALL_SESSION_CAP: at most N results of one session in the head of list /
    # aggregation recalls; "0" (default) = no cap.
    recallSessionCap: ""
    # DAKERA_SENTENCE_DECOMP: "false" = no sentence sub-memories derived on any write path
    # (default on).
    sentenceDecomp: ""
    # DAKERA_SUPERSEDES_EVENT_TIME: "false" = Supersedes edges ordered by created_at only
    # (default on: by the memories' event dates when both carry one).
    supersedesEventTime: ""
    # DAKERA_MAX_CONNECTIONS: most open REST connections, 1-1000000 (default 10000); one
    # over the cap is closed at once.
    maxConnections: ""
    # DAKERA_SHUTDOWN_DRAIN_SECS: longest REST drain at shutdown, 0-3600 (default 8; SSE
    # streams end at the signal). The server first waits up to 15 s for running media jobs:
    # the chart refuses a value with which 15 + this + 5 s would not fit in
    # dakera.terminationGracePeriodSeconds.
    shutdownDrainSecs: ""
    # DAKERA_ALLOWED_HOSTS: read ONLY with authEnabled: false. A request whose Host is not
    # localhost / *.localhost / an IP / a single-label name (the Service name) or listed
    # here gets 421 HOST_NOT_ALLOWED (DNS-rebinding guard; /health* and /internal/* are
    # exempt). Without authentication, list every dotted name clients use: the Service FQDN
    # (<fullname>.<namespace>.svc.cluster.local) and the ingress host. Comma separated; "*" = any.
    #   allowedHosts: "dakera.dakera.svc.cluster.local,api.dakera.example.com"
    allowedHosts: ""

    # Document import (server 0.12.3, on by default; server docs/documents.md):
    # POST /v1/memory/documents (text, Markdown, HTML) and
    # POST /v1/namespaces/{ns}/attachments/{ref}/document (PDF, DOCX, ...; needs the attachment
    # lane, dakera.features.multimodal). Each value is rendered only when set.
    # Memory: PDF / DOCX are parsed in `dakera extract-text` child processes, up to
    # extractConcurrency x extractMemoryMb (2 x 1024 MB by default) on top of the server, inside
    # the container's memory limit (dakera.resources, 4Gi by default). For PDF-heavy imports
    # raise the limit (6Gi) or set extractConcurrency "1".
    # Body size: an upload is up to maxBytes (25 MiB): an ingress in front must accept it
    # (ingress.annotations sets ingress-nginx's proxy-body-size; its own default is 1m).
    documents:
      enabled: ""             # DAKERA_DOCUMENTS: "false" = 501 FEATURE_DISABLED
      maxBytes: ""            # DAKERA_DOCUMENT_MAX_BYTES, default 26214400 (25 MiB)
      maxTextBytes: ""        # DAKERA_DOCUMENT_MAX_TEXT_BYTES, default 20971520 (20 MiB)
      maxChunks: ""           # DAKERA_DOCUMENT_MAX_CHUNKS, default 5000
      chunkTokens: ""         # DAKERA_DOCUMENT_CHUNK_TOKENS, default 400, 32-8192
      chunkOverlapTokens: ""  # DAKERA_DOCUMENT_CHUNK_OVERLAP_TOKENS, default 50, 0-1024
      extractTimeoutSecs: ""  # DAKERA_DOCUMENT_EXTRACT_TIMEOUT_SECS, default 60
      extractMemoryMb: ""     # DAKERA_DOCUMENT_EXTRACT_MEMORY_MB, default 1024 (per child)
      extractConcurrency: ""  # DAKERA_DOCUMENT_EXTRACT_CONCURRENCY, default 2

  # Root API key — REQUIRED, one of two ways:
  #   rootApiKey:     the chart stores it (and the MinIO credentials) in <release>-secrets;
  #   existingSecret: the name of a Secret you manage, with the same keys
  #                   (DAKERA_ROOT_API_KEY; with the built-in MinIO also MINIO_ROOT_PASSWORD,
  #                   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY). Nothing secret in the values.
  # Neither: create <release>-secrets yourself (the chart prints the command).
  # rootApiKey: ""
  existingSecret: ""

  # Cluster mode (DAKERA_CLUSTER_MODE=true, set through extraEnv) needs
  # DAKERA_CLUSTER_SECRET: at least 16 characters, the same on every node. From
  # server 0.12.1 a cluster node without it exits with code 78, upgraded or not,
  # so the chart refuses to render cluster mode without it. It is kept in a
  # Secret, never in the ConfigMap. Give it either way:
  #   secret:        the chart stores it in <release>-secrets (key DAKERA_CLUSTER_SECRET)
  #   existingSecret: read it from a Secret you manage (name + key)
  # One release is one node: give every release the same value (the chart does
  # not generate one, a generated value would differ per release). Nodes with and
  # without the secret do not see each other: switch them all in one window
  # (README, "Cluster mode"). Leave both empty for a standalone
  # server. Also set a stable DAKERA_CLUSTER_NODE_ID per node.
  cluster:
    secret: ""
    existingSecret:
      name: ""
      key: DAKERA_CLUSTER_SECRET

  # Extra environment variables for the Dakera container, appended AFTER the ones
  # the chart sets from `config` above. Standard Kubernetes EnvVar list: each item
  # is {name, value} or {name, valueFrom}. Do not repeat a name the chart already
  # sets (DAKERA_HOST/PORT/GRPC_PORT/STORAGE/STORAGE_PATH/S3_*/AUTH_ENABLED/
  # TIERED*/SEARCH_MODE/..., RUST_LOG; the 0.12.2 / 0.12.3 settings in `config` when set: an
  # extraEnv entry wins over the ConfigMap). DAKERA_DATA_DIR is an alias of
  # DAKERA_STORAGE_PATH: do not set it. Values must be strings.
  #
  #   extraEnv:
  #     - name: DAKERA_MODEL              # embedding model (see the model change note below)
  #       value: bge-m3
  #     - name: DAKERA_ENCRYPTION_KEY
  #       valueFrom:
  #         secretKeyRef: {name: my-dakera-secrets, key: encryptionKey}
  #     - name: DAKERA_CLUSTER_MODE
  #       value: "true"
  #
  # Embedding model change: the store records the model that embedded it. From
  # 0.12.1 a pod with another model of the registry starts and re-embeds the store
  # in the background, one agent namespace at a time, each answered with its own
  # model until its turn (progress: /health embedding_model_change). Not in the
  # background (the pod exits at startup, as on 0.12.0) under DAKERA_TIERED=1,
  # late-interaction scoring, the visual lane, or a recorded model this build does
  # not know: there, set DAKERA_ALLOW_MODEL_CHANGE=1 for ONE rollout, re-embed with
  # POST /admin/namespaces/migrate-dimensions, then remove it again.
  extraEnv: []

  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""

  # Models. The image ships bge-large and the reranker in its own model store
  # (/usr/local/share/dakera/models): they load in seconds with no network and
  # need nothing below. Any other model (DAKERA_MODEL=bge-m3 / colbert-small,
  # whisper, the vision model, GLiNER) is downloaded into the model cache
  # (/app/models) on first use.
  models:
    # Pulled by an init container (`dakera models pull`) before the server
    # starts. Model names (`dakera models list`), or `configured`: what the
    # environment above configures (extraEnv included).
    #   pull: [configured]
    #   pull: [bge-m3, whisper]       # `whisper` is the default model; name another, e.g. whisper-base
    pull: []
    # Keep the model cache on a volume so a restarted or rescheduled pod does
    # not download again. Off: the cache is an emptyDir. Air-gapped: seed this
    # volume ahead (`dakera models pull`) from a host that can reach the Hub.
    # ReadWriteMany shares one cache between replicas; ReadWriteOnce needs one.
    persistence:
      enabled: false
      size: 10Gi
      storageClass: ""
      accessMode: ReadWriteOnce

  # ---- v0.12 features (ALL OFF BY DEFAULT) ----------------------------------------------
  # Each block switches one v0.12 feature on, with the variables it needs, and wires what
  # it implies (the model cache volume, an init container that pulls the models, resources).
  # With everything off the chart renders exactly what it did without this block. Per
  # feature: what it is, the resources it costs, what it cannot be combined with and how to
  # verify it: README, "Features in v0.12.0", and the dakera-deploy guide docs/features-v0.12.md.
  #
  # Checks (helm refuses to render, with a message, instead of a pod that exits at start):
  #   * multilingual, lateInteraction and vision need dakera.config.tiered: "0" (the tiered
  #     embedding engine always embeds with bge-large and refuses late interaction);
  #   * multilingual and lateInteraction are exclusive (one embedding model per store);
  #   * vision is a store of its own: not with multilingual / lateInteraction, and install it
  #     as its own release (its namespaces hold 128-d page vectors, not text embeddings);
  #   * rabitq needs dakera.config.searchMode left at "hybrid".
  # multilingual, lateInteraction and vision change the embedding model or the lane. On an
  # existing store, multilingual re-embeds it in the background (0.12.1, see the extraEnv
  # note above). lateInteraction and vision are not re-embedded in the background: a FRESH
  # store, or acknowledge the change for ONE rollout with extraEnv
  # DAKERA_ALLOW_MODEL_CHANGE=1 and re-embed. They are one-way for v0.11 (`dakera downgrade`
  # refuses them).
  features:
    # When a feature that needs a model outside the image is on (multilingual,
    # lateInteraction, multimodal, vision):
    #   prePull: an init container runs `dakera models pull configured` (when
    #     dakera.models.pull is empty), so the pod is ready with the models on disk and a
    #     model whose one-time conversion would not fit the memory budget is converted
    #     outside the server;
    #   persistModelCache: the model cache is a PVC (dakera.models.persistence.size, 10Gi by
    #     default: bge-m3 ~570 MB, colbert-small ~34 MB, whisper-tiny.en ~151 MB (the default whisper-base: TODO, being measured),
    #     colmodernvbert ~966 MB, GLiNER ~782 MB, each plus an ORT-format copy of about the
    #     same size) so a restarted pod does not download again. ReadWriteOnce: one server pod.
    prePull: true
    persistModelCache: true

    # Multilingual: bge-m3 (1024-d, CPU ONNX only, ~570 MB download) + per-language
    # full-text + CJK bigrams + multilingual query routing. Per request: "lang".
    multilingual:
      enabled: false
      # BM25 analyzer (DAKERA_FULLTEXT_LANGUAGE): an ISO 639-1 code or English name (de,
      # french, pt-BR, ...), or zh/ja/ko/th/none/multilingual (no stemming). From 0.12.1 an
      # existing index built with another analyzer is re-analysed in the background at the
      # next start (served as built until then).
      fulltextLanguage: multilingual
      # DAKERA_FULLTEXT_CJK_BIGRAMS: "" follows the language (on unless en); "true" / "false".
      cjkBigrams: ""
      # DAKERA_QUERY_LANG: en de fr es it pt nl, or auto (detected per query).
      queryLang: auto
      # DAKERA_MAX_SEQ_LENGTH: "" = the model's default cap (2048 for bge-m3; it supports
      # 8192 at about 4 GiB of attention scores per layer per row).
      maxSeqLength: ""

    # Multimodal: attachments (files per agent, referenced from memories) + speech to text
    # (WAV only). Works on an existing store. The Whisper model is DAKERA_WHISPER_MODEL, set
    # through dakera.extraEnv (default whisper-base):
    #   whisper-base     multilingual (~99 languages), language auto-detected; the default, recommended
    #   whisper-tiny.en  English, the lightest (~151 MB)
    #   whisper-base.en  English, better
    #   whisper-tiny     multilingual, the lightest
    #   whisper-small    multilingual, the quality option
    # Upgrading: with no DAKERA_WHISPER_MODEL set, speech now transcribes with whisper-base;
    # set whisper-tiny.en to keep the lightest English model.
    # Multilingual models record the detected language as the memory's lang (a per-request
    # lang overrides it). Models are SHA-pinned; `dakera models pull` (dakera.models.pull)
    # covers every variant. TODO: sizes of the new models once measured.
    multimodal:
      enabled: false
      # DAKERA_ATTACHMENT_MAX_BYTES: "" = 26214400 (25 MiB). Also bounded by DAKERA_MAX_BODY_SIZE
      # (dakera.config.maxBodySize).
      attachmentMaxBytes: ""
      # DAKERA_MEM_HIGH_WATER_FRACTION: "" = 0.85. A media job reserves its peak memory against
      # the limit x this, waits up to 10 s, then answers 503 + Retry-After.
      memHighWaterFraction: ""
      # Used INSTEAD of dakera.resources while this feature is on: the measured configuration
      # is a 4-core / 8 GiB container with every model loaded (530 MiB anonymous memory; an image
      # page peaks +1.9 GiB at 17 tiles). null (--set dakera.features.multimodal.resources=null) keeps dakera.resources.
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "4"
          memory: 8Gi

    # Vision: image / page indexing and visual recall (colmodernvbert, ~966 MB, ~10.7 s per
    # page on CPU, one page at a time; PNG only). Implies attachments. A DEDICATED store: install
    # it as its own release (own MinIO / bucket and data volume), never over a text store.
    vision:
      enabled: false
      # Used INSTEAD of dakera.resources (and of multimodal.resources) while vision is on; null keeps dakera.resources.
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: "4"
          memory: 8Gi

    # Multi-vector records: POST /v1/namespaces/{ns}/records, one indexed vector plus up to 8
    # named extra representations. Works on an existing store.
    records:
      enabled: false
      maxVectors: ""   # DAKERA_RECORD_MAX_VECTORS, "" = 4096
      maxBytes: ""     # DAKERA_RECORD_MAX_BYTES, "" = 8388608 (8 MiB)

    # Late interaction: DAKERA_MODEL=colbert-small (~34 MB, 96-d token vectors) +
    # DAKERA_SCORING_STRATEGY=late-interaction: recall reranks with MaxSim per token. Opt-in
    # for a reason: on the same LoCoMo harness it scored below bge-large (better only on
    # multi-hop questions; server RELEASE_NOTES).
    lateInteraction:
      enabled: false

    # RaBitQ search mode (DAKERA_SEARCH_MODE=rabitq): a LATENCY option. Its codes sit in memory
    # next to the float vectors (no memory saving) and are rebuilt after a restart.
    rabitq:
      enabled: false
      bits: ""         # DAKERA_RABITQ_BITS: 1-8, "" = 1 (4 is the usual quality point)

  # The image runs as uid/gid 1000 (`dakera`). fsGroup gives that group the
  # volumes the chart mounts (data PVC, model cache, emptyDirs) so a provisioner
  # whose volume root is root:root 0755 does not leave the server unable to write
  # (Init:CrashLoopBackOff on EACCES). OnRootMismatch avoids a recursive walk of
  # a large volume at every start.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault

  # Root filesystem read-only (the default). Everything the server writes is on a volume:
  # the data root (the PVC, or an emptyDir with persistence.enabled=false), the model
  # cache and /tmp. Measured with server 0.12.2: store, recall and backups work (0.12.3's
  # distroless image writes the same paths).
  readOnlyRootFilesystem: true

  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 4Gi

  # A server locks its data root while it runs (one server per data root), so
  # the chart does not scale one release horizontally: autoscaling is off by
  # default. Enable it only with persistence.enabled=false and an external S3.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  service:
    type: ClusterIP
    httpPort: 3000
    grpcPort: 50051

  # Probe timeouts (seconds). The probes are httpGet: they need nothing in the image (no
  # curl, no shell). Kubernetes' default of 1 s fails a busy server.
  probes:
    timeoutSeconds: 5

  # SIGTERM: up to 15 s for running media jobs, then the REST drain
  # (config.shutdownDrainSecs, 8 s by default), then the final flushes.
  terminationGracePeriodSeconds: 30

# ---- Rollback to v0.11 -------------------------------------------------------
# `dakera downgrade` makes the data v0.11.108's again. It is a one-off Job that
# must run AFTER the server has stopped. It is not rendered unless enabled; see
# README, "Rolling back to v0.11":
#   kubectl scale deploy/<fullname> --replicas=0
#   helm template <release> ./charts/dakera <your values> \
#     --set rollback.enabled=true --show-only templates/rollback-job.yaml \
#     | kubectl apply -f -
# The Job must run with the image of the version being rolled back, 0.12.3 (the default):
# 0.12.2 and later write binary RocksDB hot-tier records, and their `dakera downgrade` rewrites them
# as JSON before v0.11.108 can read them (report field hot_tier_records_rewritten_as_json).
# A 0.12.0 / 0.12.1 image would not. Rolling back to 0.12.0 / 0.12.1 needs no Job.
rollback:
  enabled: false
  # Image that runs `downgrade`: leave empty (the server's image, 0.12.3). Never an older
  # v0.12 image after 0.12.2 has run on the data (see above).
  image: ""
  ttlSecondsAfterFinished: 86400

# ---- Dakera Dashboard -------------------------------------------------------
# Dashboard 0.4+ signs operators in with their own API key at /login and keeps it in
# server memory; the chart gives it no key. Sessions live in memory, so keep one replica
# (or sticky sessions) and serve it behind TLS that forwards X-Forwarded-Proto and Host.
dashboard:
  enabled: true
  image:
    repository: ghcr.io/dakera-ai/dakera-dashboard
    tag: "0.5.2"
    pullPolicy: IfNotPresent

  replicaCount: 1

  # Addresses / CIDRs (comma or space separated) of the reverse proxies in front of the
  # dashboard whose X-Forwarded-For names the client (DAKERA_TRUSTED_PROXIES, dashboard
  # 0.5.2; nginx real_ip): the sign-in throttle then counts the real client. Typically the
  # ingress controller's pod CIDR. Empty: the connecting peer is the client (behind a proxy,
  # every user shares the proxy's address and one person's typos throttle everyone).
  #   trustedProxies: "10.244.0.0/16"
  trustedProxies: ""

  # Longest a sign-in lasts, in hours (dashboard default 12; 15 minutes to 7 days).
  # Idle sessions end after 2 hours. Empty: the dashboard's default.
  sessionTtlHours: ""

  # Dashboard 0.5.2 runs as uid/gid 10001 and writes only /tmp: with readOnlyRootFilesystem
  # the chart mounts an emptyDir there. An image up to 0.5.1 starts as root and edits its
  # nginx configuration: it needs runAsNonRoot false, runAsUser 0, readOnlyRootFilesystem
  # false and capabilities.add [CHOWN, DAC_OVERRIDE, SETGID, SETUID].
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  service:
    type: ClusterIP
    port: 3000

# ---- Dakera MCP Server ------------------------------------------------------
# Off by default: dakera-mcp (0.10.x) speaks MCP over stdio only. As a pod nothing
# writes to its stdin, so it exits at once and restarts in a loop (CrashLoopBackOff,
# measured with 0.10.11); it never listens on mcp.config.port. Run it next to the MCP
# client instead (`dakera-mcp` with DAKERA_API_URL and DAKERA_API_KEY).
mcp:
  enabled: false
  image:
    repository: ghcr.io/dakera-ai/dakera-mcp
    tag: "0.10.11"
    pullPolicy: IfNotPresent

  replicaCount: 1

  config:
    port: 3001

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  service:
    type: ClusterIP
    port: 3001

# ---- MinIO (built-in S3) ----------------------------------------------------
minio:
  enabled: true
  # minio/minio is no longer published on Docker Hub (the repository is gone, so its
  # tags cannot be pulled). Chainguard's maintained MinIO build; its free tier
  # publishes `latest` only.
  image:
    repository: cgr.dev/chainguard/minio
    tag: latest
    pullPolicy: IfNotPresent

  # Credentials — override via --set, or keep them in dakera.existingSecret
  rootUser: dakera-minio  # override with a non-default username to reduce attack surface
  rootPassword: ""  # REQUIRED with dakera.rootApiKey (the chart's Secret); else in your Secret

  # Only the Dakera pods of this release (server, init container, rollback Job) reach
  # MinIO's API. Enforced by network plugins that implement NetworkPolicy; elsewhere it has
  # no effect. `additionalFrom`: more NetworkPolicyPeer entries allowed on ports 9000/9001
  # (e.g. your Prometheus scraping /minio/v2/metrics/cluster). kubectl port-forward still works.
  networkPolicy:
    enabled: true
    additionalFrom: []

  persistence:
    size: 50Gi
    storageClass: ""

  # MinIO needs >=4GB RAM under bench-load concurrency (DAK-3971)
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

# Use external S3 instead of MinIO:
# minio:
#   enabled: false
# dakera:
#   config:
#     s3Endpoint: https://s3.amazonaws.com

# ---- Ingress ----------------------------------------------------------------
ingress:
  enabled: false
  className: nginx
  # apiHost: api.dakera.yourdomain.com
  # dashboardHost: dashboard.dakera.yourdomain.com
  # mcpHost: mcp.dakera.yourdomain.com
  # proxy-body-size: ingress-nginx refuses bodies over 1m by default; backups, imports,
  # attachments and documents (up to 25 MiB) need more. Matches dakera.config.maxBodySize.
  # Other controllers have their own setting. Annotations you set are merged with this one.
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    # cert-manager.io/cluster-issuer: letsencrypt-prod
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
  tls: []
    # - secretName: dakera-tls
    #   hosts:
    #     - api.dakera.yourdomain.com

# ---- Monitoring (Prometheus + Grafana) -------------------------------------
monitoring:
  # NOTE: `enabled` still has no templates (it never had): the Prometheus / Grafana blocks
  # below are inert. Use your own Prometheus (the server pod is annotated
  # prometheus.io/scrape, port, path /metrics) and the two opt-in objects that follow.
  enabled: false

  # The server's v0.12 alert rules as a Prometheus Operator PrometheusRule (the CRD must
  # exist): config warnings, degraded components, WAL, model loads, backups, encryption,
  # cold tier, RocksDB, cluster replication. Off by default. `labels` is what your
  # Prometheus' ruleSelector matches (kube-prometheus-stack: `release: <its release>`).
  # DakeraDown matches job="dakera": name your scrape job so, or edit the rule.
  prometheusRule:
    enabled: false
    labels: {}

  # The server's v0.12 "Dakera Overview" dashboard as a ConfigMap for Grafana's dashboard
  # sidecar (kube-prometheus-stack loads label grafana_dashboard: "1"). Off by default.
  grafanaDashboard:
    enabled: false
    label: grafana_dashboard
    labelValue: "1"

  prometheus:
    image:
      repository: prom/prometheus
      tag: v3.2.0
    retention: 15d
    persistence:
      size: 10Gi
      storageClass: ""

  grafana:
    image:
      repository: grafana/grafana
      tag: "11.4.0"
    adminUser: admin
    adminPassword: ""  # auto-generated if empty
    persistence:
      size: 5Gi
      storageClass: ""

# ---- Global -----------------------------------------------------------------
global:
  namespace: dakera
  imagePullSecrets: []
