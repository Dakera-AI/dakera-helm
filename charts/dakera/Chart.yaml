  artifacthub.io/images: |
    - name: dakera
      image: ghcr.io/dakera-ai/dakera:0.12.2
    - name: dakera-dashboard
      image: ghcr.io/dakera-ai/dakera-dashboard:0.5.1
  artifacthub.io/official: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: Dakera server 0.12.2 (chart 0.12.2); the image tag follows appVersion. Dashboard 0.5.0 -> 0.5.1 (add agent, in-place key edits, rotation grace, session auto-end labels; works with 0.12.0 and 0.12.1 too)
    - kind: changed
      description: Server 0.12.2 ends sessions after 4 h without activity by default (DAKERA_SESSION_IDLE_TIMEOUT_SECS); sessions already idle longer are closed, with their summaries, on the first passes after the upgrade. New optional dakera.config.sessionIdleTimeoutSecs ("0" = the server ends no session by itself)
    - kind: added
      description: Optional dakera.config.maxMemoryContentBytes (DAKERA_MAX_MEMORY_CONTENT_BYTES, default 100000 bytes), vectorCacheBytes (DAKERA_VECTOR_CACHE_BYTES, the L1 vector cache, default 128MB; not l1CacheSize) and rocksdbRecordFormat (DAKERA_ROCKSDB_RECORD_FORMAT, binary default | json); rendered only when set, checked by values.schema.json
    - kind: changed
      description: Server 0.12.2 validates more strictly (400 for reserved dakera-curated / _dakera_* markers, mem_s ids, agent ids over 241 bytes, memory-shaped writes through raw vector routes, content over the byte limit on update); keys gain prefix patterns p*, and pre-0.12.2 entries ending in * stay inert until the key is saved again
    - kind: changed
      description: Rollback to v0.11.108 must run dakera downgrade with the 0.12.2 image (the rollback Job's default), which rewrites the binary RocksDB hot-tier records 0.12.2 writes as JSON. Rolling back to 0.12.0 / 0.12.1 needs nothing
  artifacthub.io/signKey: |
    fingerprint: keyless
    url: https://github.com/Dakera-AI/dakera-helm/blob/main/cosign.pub
