keywords:
  - agent-memory
  - ai-memory
  - ai
  - memory
  - mcp
home: https://github.com/dakera-ai/dakera-helm
sources:
  - https://github.com/dakera-ai/dakera
maintainers:
  - name: Dakera AI
    url: https://github.com/dakera-ai
icon: https://raw.githubusercontent.com/dakera-ai/dakera-deploy/main/assets/logo.png
annotations:
  artifacthub.io/images: |
    - name: dakera
      image: ghcr.io/dakera-ai/dakera:0.12.3
    - name: dakera-dashboard
      image: ghcr.io/dakera-ai/dakera-dashboard:0.5.2
  artifacthub.io/official: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: Dakera server 0.12.3 (chart 0.12.3; the image tag follows appVersion) and Dashboard 0.5.1 -> 0.5.2 (runs as uid/gid 10001, no curl, read-only root with a /tmp emptyDir; new optional dashboard.trustedProxies, DAKERA_TRUSTED_PROXIES)
    - kind: security
      description: Server image distroless (uid/gid 1000, no curl or shell tools; probes stay httpGet). POST /ops/shutdown needs a global super_admin key; four admin routes refuse unknown JSON fields (422). The GPU image is CUDA 13 and needs NVIDIA driver R580+
    - kind: security
      description: Read-only root filesystem by default, RuntimeDefault seccomp and no service-account token on every pod; MinIO reachable only from the release's Dakera pods (minio.networkPolicy, on by default); dakera.existingSecret
    - kind: added
      description: Optional server 0.12.3 settings rendered only when set - httpHeaderReadTimeoutSecs (also closes idle keep-alive connections - keep proxy idle timeouts shorter), maxConnections, shutdownDrainSecs (checked against dakera.terminationGracePeriodSeconds), allowedHosts (required with authentication off and a dotted Host name, else 421), and the recall settings neighborhoodMode, recallRankDepth, recallCollapseDerived, recallExcludeSummaries, recallSessionCap, neighborhoodEventTime, sentenceDecomp, supersedesEventTime
    - kind: added
      description: Document import settings (dakera.config.documents.* - DAKERA_DOCUMENTS, DAKERA_DOCUMENT_*); extraction uses up to 2 x 1024 MB on top of the server inside the memory limit. ingress.annotations defaults to proxy-body-size 500m (ingress-nginx's 1m refused uploads)
    - kind: changed
      description: Server probes get timeoutSeconds 5; a published chart version is never re-pushed to the OCI registry
  artifacthub.io/signKey: |
    fingerprint: keyless
    url: https://github.com/Dakera-AI/dakera-helm/blob/main/cosign.pub
