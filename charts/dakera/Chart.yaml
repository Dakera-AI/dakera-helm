annotations:
  artifacthub.io/images: |
    - name: dakera
      image: ghcr.io/dakera-ai/dakera:0.12.4
    - name: dakera-dashboard
      image: ghcr.io/dakera-ai/dakera-dashboard:0.5.3
  artifacthub.io/official: "true"
  artifacthub.io/changes: |
    - kind: changed
      description: Dakera server 0.12.4 (chart 0.12.4; the image tag follows appVersion). Dashboard 0.5.3 (forget by request, setup advice, anonymous usage telemetry: dashboard.telemetry). Entity extraction is on by default for namespaces that never set it (the background sweep tags stored memories after the upgrade); recall rankings and autopilot defaults change - each can be set back (values.yaml, Server 0.12.4 settings)
    - kind: added
      description: Optional server 0.12.4 settings rendered only when set and checked by values.schema.json - contactEmail (DAKERA_CONTACT_EMAIL), defaultEntityTypes, glinerModel (refused when it does not match the embedding model's languages), entityTagging, standingInstructions, forgetRequests, recallImportanceWeighted, recallIncludeAssociated, rerankHead, autopilotConsolidationMode
    - kind: changed
      description: Server limits 2 CPUs / 4Gi -> 4 CPUs / 6Gi (embedding and the reranker want 4 CPUs; the default models hold about 3.5 GiB); features.multilingual gets its own resources block, 8 CPUs / 8Gi (bge-m3 wants 8)
    - kind: added
      description: rollback.command checkpoint - a one-off dakera checkpoint Job before going back from 0.12.4 to an earlier 0.12 chart; NOTES warns when the data root is an emptyDir (persistence off)
  artifacthub.io/signKey: |
    fingerprint: keyless
    url: https://github.com/Dakera-AI/dakera-helm/blob/main/cosign.pub
