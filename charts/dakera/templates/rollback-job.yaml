{{- if .Values.rollback.enabled }}
{{- $cmd := .Values.rollback.command | default "downgrade" }}
{{- if not (has $cmd (list "downgrade" "checkpoint")) }}
{{- fail (printf "rollback.command must be downgrade (to v0.11.108) or checkpoint (before going back to an earlier v0.12), not %q" $cmd) }}
{{- end }}
# One-off rollback Job. Run it AFTER the server has stopped (scale the Deployment to 0
# first): it refuses (exit 78, nothing changed) while a server runs on the data. Same
# environment and volumes as the server, and the server's image (0.12.4).
#   downgrade:  to v0.11.108. `dakera downgrade` makes the data v0.11.108's again; it
#               rewrites the binary RocksDB hot-tier records 0.12.2+ writes as JSON first,
#               which an older v0.12 image would not. Read the JSON report on stdout.
#   checkpoint: before going back to an earlier v0.12 (an image swap). `dakera checkpoint`
#               replays the write-ahead log, takes one snapshot and truncates the log.
# Not part of a normal install; see the README, "Rolling back":
#   kubectl logs job/<fullname>-<command>
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "dakera.fullname" . }}-{{ $cmd }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dakera.labels" . | nindent 4 }}
    app.kubernetes.io/component: {{ $cmd }}
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: {{ .Values.rollback.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "dakera.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: {{ $cmd }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dakera.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $cmd }}
          image: "{{ .Values.rollback.image | default (printf "%s:%s" .Values.dakera.image.repository (.Values.dakera.image.tag | default .Chart.AppVersion)) }}"
          imagePullPolicy: {{ .Values.dakera.image.pullPolicy }}
          command: ["dakera"]
          args: [{{ $cmd | quote }}]
          envFrom:
            - configMapRef:
                name: {{ include "dakera.fullname" . }}-config
            - secretRef:
                name: {{ include "dakera.secretName" . }}
          {{- if or .Values.dakera.cluster.existingSecret.name .Values.dakera.extraEnv }}
          env:
            {{- include "dakera.clusterSecretEnv" . | nindent 12 }}
            {{- with .Values.dakera.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.dakera.readOnlyRootFilesystem }}
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: {{ .Values.dakera.config.dataRoot | quote }}
            - name: models
              mountPath: /app/models
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.dakera.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "dakera.fullname" . }}-rocksdb
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: models
          {{- if .Values.dakera.models.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "dakera.fullname" . }}-models
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
{{- end }}
