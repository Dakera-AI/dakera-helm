{{- if and .Values.dakera.rootApiKey .Values.dakera.existingSecret }}
{{- fail "set only one of dakera.rootApiKey (the chart creates <release>-secrets) and dakera.existingSecret (a Secret you manage)" }}
{{- end }}
{{- if .Values.dakera.rootApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dakera.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dakera.labels" . | nindent 4 }}
type: Opaque
stringData:
  DAKERA_ROOT_API_KEY: {{ .Values.dakera.rootApiKey | quote }}
  {{- if .Values.dakera.cluster.secret }}
  DAKERA_CLUSTER_SECRET: {{ .Values.dakera.cluster.secret | quote }}
  {{- end }}
  {{- if .Values.minio.enabled }}
  MINIO_ROOT_USER: {{ .Values.minio.rootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ required "minio.rootPassword is required when minio.enabled=true" .Values.minio.rootPassword | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.minio.rootUser | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.minio.rootPassword | quote }}
  {{- end }}
{{- else }}
{{- if .Values.dakera.cluster.secret }}
{{- fail "dakera.cluster.secret is stored in the chart's Secret, which is rendered only with dakera.rootApiKey: set dakera.rootApiKey, or keep the secret in your own Secret and use dakera.cluster.existingSecret" }}
{{- end }}
# No rootApiKey set — the server reads {{ include "dakera.secretName" . }}{{ if not .Values.dakera.existingSecret }}; create it{{ end }}:
#   kubectl create secret generic {{ include "dakera.secretName" . }} \
#     --from-literal=DAKERA_ROOT_API_KEY=$(openssl rand -hex 32) \
#     --from-literal=MINIO_ROOT_USER={{ .Values.minio.rootUser }} \
#     --from-literal=MINIO_ROOT_PASSWORD=$(openssl rand -hex 16) \
#     --from-literal=AWS_ACCESS_KEY_ID={{ .Values.minio.rootUser }} \
#     --from-literal=AWS_SECRET_ACCESS_KEY=<minio-password> \
#     --from-literal=DAKERA_CLUSTER_SECRET=<the same on every node> \   # clusters only, >= 16 chars
#     --namespace {{ .Release.Namespace }}
# AWS_ACCESS_KEY_ID must be minio.rootUser (the built-in MinIO's user) and
# AWS_SECRET_ACCESS_KEY the MINIO_ROOT_PASSWORD value.
# A cluster secret kept here also needs
#   --set dakera.cluster.existingSecret.name={{ include "dakera.secretName" . }}
{{- end }}
