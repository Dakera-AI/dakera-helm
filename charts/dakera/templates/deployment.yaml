apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dakera.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dakera.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.dakera.replicaCount }}
  {{- if .Values.dakera.persistence.enabled }}
  # One server per data root: v0.12 locks the data root while it runs, and the
  # volume is ReadWriteOnce. A rolling update would start the new pod beside the
  # old one, which refuses to start on the locked root (and never becomes ready,
  # so the old one is never stopped). Stop the old pod first.
  strategy:
    type: Recreate
    rollingUpdate: null
  {{- end }}
  selector:
    matchLabels:
      {{- include "dakera.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "dakera.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.dakera.config.port | quote }}
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # The volumes the server writes (data PVC, model-cache PVC, emptyDirs) are
      # group-owned by the image's user (uid/gid 1000).
      {{- with .Values.dakera.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $pull := .Values.dakera.models.pull | default list }}
      {{- if and (not $pull) (eq (include "dakera.featuresNeedModels" .) "true") .Values.dakera.features.prePull }}
      {{- $pull = list "configured" }}
      {{- end }}
      {{- with $pull }}
      # Models beyond the image's, on disk before the server starts: downloaded,
      # verified and converted into the model cache. With a v0.12 feature that needs
      # models enabled and models.pull empty, `configured` is pulled (what the
      # environment of the enabled features loads).
      initContainers:
        - name: models
          image: "{{ $.Values.dakera.image.repository }}:{{ $.Values.dakera.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.dakera.image.pullPolicy }}
          # The binary itself, not the image's entrypoint: the GPU image's
          # wrapper refuses to run without an NVIDIA GPU.
          command: ["dakera"]
          args:
            - models
            - pull
            {{- range . }}
            - {{ . | quote }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "dakera.fullname" $ }}-config
          {{- with $.Values.dakera.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ $.Values.dakera.readOnlyRootFilesystem }}
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: models
              mountPath: /app/models
            - name: tmp
              mountPath: /tmp
      {{- end }}
      containers:
        - name: dakera
          image: "{{ .Values.dakera.image.repository }}:{{ .Values.dakera.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.dakera.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.dakera.config.port }}
              protocol: TCP
            - name: grpc
              containerPort: {{ .Values.dakera.config.grpcPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "dakera.fullname" . }}-config
            - secretRef:
                name: {{ include "dakera.fullname" . }}-secrets
          {{- if or .Values.dakera.cluster.existingSecret.name .Values.dakera.extraEnv }}
          env:
            {{- include "dakera.clusterSecretEnv" . | nindent 12 }}
            {{- with .Values.dakera.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          # The port binds before the models load and /health/live answers 200
          # from then on (a model that is not in the image may download for
          # minutes): liveness never restarts a pod that is downloading. The
          # startup probe covers the time before the port binds (write-ahead-log
          # replay, stored state): periodSeconds x failureThreshold = 10 minutes.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 30
          # /health answers 200 even while a component is degraded;
          # /health/ready is 503 until storage answers and the embedding engine
          # is up.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: {{ .Values.dakera.readOnlyRootFilesystem }}
            capabilities:
              drop: [ALL]
          resources:
            {{- include "dakera.serverResources" . | nindent 12 }}
          volumeMounts:
            {{- if .Values.dakera.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.dakera.config.dataRoot | quote }}
            {{- end }}
            # The model cache (HF_HOME): models the image does not ship.
            - name: models
              mountPath: /app/models
            - name: tmp
              mountPath: /tmp
      volumes:
        {{- if .Values.dakera.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "dakera.fullname" . }}-rocksdb
        {{- end }}
        - name: models
          {{- if eq (include "dakera.modelsPersist" .) "true" }}
          persistentVolumeClaim:
            claimName: {{ include "dakera.fullname" . }}-models
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
---
{{- if .Values.dakera.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  # Name kept from chart 0.11 (-rocksdb) so an in-place helm upgrade keeps using
  # the same volume; it now holds the whole data root, not only RocksDB.
  name: {{ include "dakera.fullname" . }}-rocksdb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dakera.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.dakera.persistence.storageClass }}
  storageClassName: {{ .Values.dakera.persistence.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.dakera.persistence.size }}
{{- end }}
---
{{- if eq (include "dakera.modelsPersist" .) "true" }}
# The model cache: models the image does not ship, downloaded (and converted)
# once instead of at every pod start.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "dakera.fullname" . }}-models
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dakera.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.dakera.models.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.dakera.models.persistence.size }}
  {{- if .Values.dakera.models.persistence.storageClass }}
  storageClassName: {{ .Values.dakera.models.persistence.storageClass }}
  {{- end }}
{{- end }}
---
{{- if .Values.dashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dakera.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dakera.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicaCount }}
  selector:
    matchLabels:
      {{- include "dakera.dashboard.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dashboard
  template:
    metadata:
      labels:
        {{- include "dakera.dashboard.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dashboard
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: dashboard
          image: "{{ .Values.dashboard.image.repository }}:{{ .Values.dashboard.image.tag }}"
          imagePullPolicy: {{ .Values.dashboard.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            # Dashboard 0.4+ holds no API key: operators sign in with their own key, kept
            # server-side by the dashboard's session service. Never pass DAKERA_API_KEY here.
            - name: DAKERA_API_UPSTREAM
              value: "http://{{ include "dakera.fullname" . }}:{{ .Values.dakera.config.port }}"
            {{- with .Values.dashboard.sessionTtlHours }}
            - name: DAKERA_SESSION_TTL_HOURS
              value: {{ . | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /_session/healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /_session/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
{{- end }}
---
{{- if .Values.mcp.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dakera.fullname" . }}-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dakera.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "dakera.mcp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        {{- include "dakera.mcp.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: dakera-mcp
          image: "{{ .Values.mcp.image.repository }}:{{ .Values.mcp.image.tag }}"
          imagePullPolicy: {{ .Values.mcp.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.mcp.config.port }}
          env:
            # The variable dakera-mcp reads (it falls back to http://localhost:3000).
            - name: DAKERA_API_URL
              value: "http://{{ include "dakera.fullname" . }}:{{ .Values.dakera.config.port }}"
            - name: DAKERA_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "dakera.fullname" . }}-secrets
                  key: DAKERA_ROOT_API_KEY
            - name: MCP_PORT
              value: {{ .Values.mcp.config.port | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
{{- end }}
