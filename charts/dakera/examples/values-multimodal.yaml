# Attachments + speech to text (WAV only). Works on an existing store.
# Whisper model: default whisper-base (multilingual, language auto-detected). To choose another, add to
# dakera.extraEnv DAKERA_WHISPER_MODEL = whisper-tiny.en | whisper-base.en | whisper-tiny | whisper-small (see README).
dakera:
  features:
    multimodal:
      enabled: true
