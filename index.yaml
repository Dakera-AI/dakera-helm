    version: 0.12.1
  - annotations:
      artifacthub.io/changes: |
        - kind: changed
          description: Dakera server 0.12.0 (chart 0.12.0). v0.11 lives on the release/0.11 branch and chart versions 0.11.x
        - kind: changed
          description: Probes read /health/live (liveness + startup) and /health/ready (readiness); the port answers while models load
        - kind: added
          description: DAKERA_CLUSTER_SECRET through a Secret (dakera.cluster), model cache volume and pre-pull (dakera.models), fsGroup, extraEnv, optional rollback Job (dakera downgrade)
        - kind: added
          description: Opt-in v0.12 features (dakera.features) - multilingual, multimodal, vision, records, late interaction, RaBitQ - with the model cache, models pre-pull and resources wired, plus a PrometheusRule and a Grafana dashboard
        - kind: removed
          description: DAKERA_L2_CACHE_PATH (v0.12 derives every path from DAKERA_STORAGE_PATH)
        - kind: fixed
          description: The built-in MinIO is now actually deployed when minio.enabled=true, creates the server's bucket, and uses cgr.dev/chainguard/minio (minio/minio is no longer on Docker Hub)
        - kind: changed
          description: mcp.enabled defaults to false (dakera-mcp is stdio-only and crash-loops as a pod); its Deployment now sets DAKERA_API_URL
      artifacthub.io/images: |
        - name: dakera
          image: ghcr.io/dakera-ai/dakera:0.12.0
      artifacthub.io/official: "true"
      artifacthub.io/signKey: |
        fingerprint: keyless
        url: https://github.com/Dakera-AI/dakera-helm/blob/main/cosign.pub
